name: hightide-design Publish

on:
  push:
    tags:
      - "hightide-design@*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish precheck
        run: node .github/scripts/publish-precheck.mjs
        env:
          TAG_PREFIX: hightide-design
          PACKAGE_DIR: packages/hightide-design
          TAG_NAME: ${{ github.ref_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @helpwave/hightide-design... run init
      - run: pnpm --filter @helpwave/hightide-design... build

      - name: Publish @helpwave/hightide-design
        run: pnpm --filter @helpwave/hightide-design publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
