name: hightide-native Publish

on:
  push:
    tags:
      - "hightide-native@*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish precheck
        run: node .github/scripts/publish-precheck.mjs
        env:
          TAG_PREFIX: hightide-native
          PACKAGE_DIR: packages/hightide-native
          TAG_NAME: ${{ github.ref_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @helpwave/hightide-native... run init
      - run: pnpm --filter @helpwave/hightide-native... run build

      - name: Publish @helpwave/hightide-native
        run: pnpm --filter @helpwave/hightide-native publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
